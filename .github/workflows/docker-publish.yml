name: Build and Publish Multi-Arch Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Image (ARM64 & AMD64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up QEMU (for ARM64 Raspberry Pi emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/arm64,linux/amd64'

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: 🚀 Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional automated deployment step to Raspberry Pi
  deploy-to-pi:
    name: 🍓 Deploy to Raspberry Pi (192.168.0.150)
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 SSH Deploy to Raspberry Pi (Optional via Secrets)
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ env.HAS_SSH_SECRET == 'true' }}
        env:
          HAS_SSH_SECRET: ${{ secrets.PI_SSH_KEY != '' }}
        with:
          host: ${{ secrets.PI_HOST || '192.168.0.150' }}
          username: ${{ secrets.PI_USERNAME || 'pi' }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT || 22 }}
          script: |
            cd ~/brainboss || cd /opt/brainboss
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -f
