services:
  # ==========================================
  # BrainBoss Web Application
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: brainboss:latest
    container_name: brainboss_app
    restart: unless-stopped
    ports:
      # Map Raspberry Pi host port (default: 3080) to container port 3000
      - "${APP_PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-brainboss}:${POSTGRES_PASSWORD:-brainboss_pass}@postgres:5432/${POSTGRES_DB:-brainboss}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=https://${DOMAIN:-brainboss.brandstaetter.rocks}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brainboss_net

  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: brainboss_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-brainboss}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-brainboss_pass}
      - POSTGRES_DB=${POSTGRES_DB:-brainboss}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainboss} -d ${POSTGRES_DB:-brainboss}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - brainboss_net

networks:
  brainboss_net:
    driver: bridge

volumes:
  postgres_data:
    name: brainboss_postgres_data
